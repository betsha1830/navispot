services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3883:3000"
    environment:
      NODE_ENV: production
      # false = plain HTTP on http://127.0.0.1:3883 (previous behavior).
      # true = HTTPS with a self-signed certificate on the same port.
      # With true, also set NEXT_PUBLIC_APP_URL and SPOTIFY_REDIRECT_URI to
      # https://127.0.0.1:3883 in .env.local. To include a LAN IP, set
      # SSL_CERT_SAN and delete ./certs so the certificate is regenerated.
      ENABLE_HTTPS: true
      SSL_CERT_CN: localhost
      SSL_CERT_SAN: DNS:localhost,IP:127.0.0.1
    env_file:
      - .env.local
    volumes:
      - ./certs:/certs
    restart: unless-stopped

  # Optional: Navidrome instance for testing
  # Uncomment to use a local Navidrome server. First login: the admin
  # user is created from the credentials you use on first sign-in.
  # navidrome:
  #   image: deluan/navidrome:latest
  #   ports:
  #     - "4533:4533"
  #   environment:
  #     # Optional config — e.g. ND_LOGLEVEL: debug
  #     # See https://www.navidrome.org/docs/usage/configuration/
  #   volumes:
  #     - ./data:/data
  #     - ./music:/music:ro
  #   restart: unless-stopped
